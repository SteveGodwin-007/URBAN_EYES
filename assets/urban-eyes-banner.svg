<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Urban Eyes Chennai — Smart City Pothole Monitoring for GCC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101c33"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative glows -->
  <circle cx="1150" cy="-20" r="360" fill="#38bdf8" opacity="0.07"/>
  <circle cx="-60" cy="420" r="300" fill="#f59e0b" opacity="0.05"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="10" height="400" fill="url(#accent)"/>

  <!-- Bus route (dashed) with stops -->
  <polyline points="360,310 545,248 770,302 985,222" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 9" stroke-linecap="round" opacity="0.55"/>
  <circle cx="360" cy="310" r="5" fill="#38bdf8" opacity="0.85"/>
  <circle cx="545" cy="248" r="5" fill="#38bdf8" opacity="0.85"/>
  <circle cx="770" cy="302" r="5" fill="#38bdf8" opacity="0.85"/>
  <circle cx="985" cy="222" r="5" fill="#38bdf8" opacity="0.85"/>

  <!-- Radar rings -->
  <circle cx="170" cy="150" r="104" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.08"/>
  <circle cx="170" cy="150" r="82" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.12"/>
  <circle cx="170" cy="150" r="62" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.18"/>

  <!-- Location pin -->
  <path d="M 170 232 C 138 196 122 174 122 150 A 48 48 0 1 1 218 150 C 218 174 202 196 170 232 Z" fill="url(#accent)"/>
  <circle cx="170" cy="150" r="18" fill="#0b1220"/>

  <!-- Title -->
  <text x="360" y="165" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="56" fill="#f8fafc">Urban Eyes Chennai</text>
  <text x="360" y="206" font-family="Segoe UI, Arial, sans-serif" font-weight="400" font-size="23" fill="#94a3b8">Smart City Pothole Monitoring for Greater Chennai Corporation</text>

  <!-- Feature chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="360" y="240" width="230" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="475" y="263" text-anchor="middle" fill="#e2e8f0">Real-time YOLO detection</text>

    <rect x="602" y="240" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="682" y="263" text-anchor="middle" fill="#e2e8f0">Live GIS map</text>

    <rect x="774" y="240" width="200" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="874" y="263" text-anchor="middle" fill="#e2e8f0">GCC admin workflow</text>
  </g>

  <!-- Footer meta -->
  <text x="1180" y="382" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Chennai · Tamil Nadu · India</text>
  <text x="14" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">v1.0</text>
</svg>
